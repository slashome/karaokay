[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "karaokay"
version = "0.1.0"
description = "Synchronized lyrics in your terminal, powered by MPD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "slashome" }]
keywords = ["mpd", "karaoke", "lyrics", "lrc", "curses", "terminal"]
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "python-mpd2>=3.0",
    "syncedlyrics>=0.7",
]

[project.scripts]
karaokay = "karaokay:main"

[project.urls]
Homepage = "https://github.com/slashome/karaokay"
Issues = "https://github.com/slashome/karaokay/issues"

[tool.setuptools]
py-modules = ["karaokay"]
