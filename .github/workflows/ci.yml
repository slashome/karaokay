name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime deps
        # python-mpd2 is checked at startup; karaokay bails before --help can
        # be reached if it's missing. requests backs the LrcLib picker.
        run: pip install python-mpd2 requests

      - name: Syntax check
        run: python -m py_compile karaokay/*.py

      - name: --help smoke test
        run: python -m karaokay --help
