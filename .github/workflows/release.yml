name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sanity gate
        run: |
          pip install python-mpd2 requests
          python -m py_compile karaokay/*.py
          python -m karaokay --help

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Karaokay ${GITHUB_REF_NAME}" \
            --generate-notes

      # Skipped (not failed) until HOMEBREW_TAP_TOKEN is configured.
      - name: Bump homebrew tap formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: dawidd6/action-homebrew-bump-formula@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: slashome/homebrew-tap
          formula: karaokay
          tag: ${{ github.ref_name }}
