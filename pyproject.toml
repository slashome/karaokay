[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "karaokay"
dynamic = ["version"]
description = "Synchronized lyrics in your terminal, powered by MPD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "slashome" }]
keywords = ["mpd", "karaoke", "lyrics", "lrc", "curses", "terminal"]
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "python-mpd2>=3.0",
    "syncedlyrics>=0.7",
    "requests>=2.25",
]

[project.optional-dependencies]
cover = ["pillow>=9"]
# Only needed for exotic YAML in the config file: the flat `key: value` subset
# documented in the README is read by a built-in parser when PyYAML is absent.
config = ["pyyaml>=6"]

[project.scripts]
karaokay = "karaokay.cli:main"

[project.urls]
Homepage = "https://github.com/slashome/karaokay"
Issues = "https://github.com/slashome/karaokay/issues"

[tool.setuptools]
packages = ["karaokay"]

[tool.setuptools.dynamic]
version = { attr = "karaokay.__version__" }
